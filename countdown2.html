<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cuenta Regresiva - RelayWeen 2026</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Librería de Confeti por si llega a cero -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<!-- Fuente Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
   body {
     font-family: 'Plus Jakarta Sans', sans-serif;
     background: radial-gradient(circle at top, #3b0764 0%, #0f172a 60%, #020617 100%);
     min-height: 100vh;
     color: #f8fafc;
   }
   .glass-card {
     background: rgba(30, 41, 59, 0.7);
     backdrop-filter: blur(14px);
     border: 1px solid rgba(255, 255, 255, 0.12);
   }
   .time-box {
     background: rgba(15, 23, 42, 0.85);
     border: 1px solid rgba(245, 158, 11, 0.3);
     box-shadow: 0 10px 30px -10px rgba(245, 158, 11, 0.2);
   }
</style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">
<!-- Contenedor Principal -->
<main class="max-w-xl w-full glass-card rounded-3xl p-8 md:p-12 text-center shadow-2xl relative overflow-hidden">
<!-- Decoración de fondo -->
<div class="absolute -top-12 -right-12 w-36 h-36 bg-orange-500/10 rounded-full blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-12 -left-12 w-36 h-36 bg-purple-500/10 rounded-full blur-2xl pointer-events-none"></div>
<!-- Encabezado -->
<div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-orange-500/20 text-orange-300 border border-orange-500/30 text-xs font-extrabold uppercase tracking-widest mb-4">
     🎃 Cuenta Regresiva Oficial
</div>
<h1 class="text-3xl md:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-orange-400 via-amber-300 to-purple-400 bg-clip-text text-transparent mb-2">
     RelayWeen 2026
</h1>
<p class="text-slate-400 text-sm md:text-base mb-8">
     El gran concurso de disfraces está por comenzar. ¡Prepárate!
</p>
<!-- Reloj de cuenta regresiva (Grid) -->
<div id="countdownGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-3.5 md:gap-4 mb-8">
<!-- Días -->
<div class="time-box rounded-2xl p-4 md:p-5 flex flex-col items-center justify-center">
<span id="days" class="text-3xl md:text-5xl font-black text-amber-400">00</span>
<span class="text-xs font-bold text-slate-400 uppercase tracking-wider mt-1">Días</span>
</div>
<!-- Horas -->
<div class="time-box rounded-2xl p-4 md:p-5 flex flex-col items-center justify-center">
<span id="hours" class="text-3xl md:text-5xl font-black text-white">00</span>
<span class="text-xs font-bold text-slate-400 uppercase tracking-wider mt-1">Horas</span>
</div>
<!-- Minutos -->
<div class="time-box rounded-2xl p-4 md:p-5 flex flex-col items-center justify-center">
<span id="minutes" class="text-3xl md:text-5xl font-black text-white">00</span>
<span class="text-xs font-bold text-slate-400 uppercase tracking-wider mt-1">Minutos</span>
</div>
<!-- Segundos -->
<div class="time-box rounded-2xl p-4 md:p-5 flex flex-col items-center justify-center">
<span id="seconds" class="text-3xl md:text-5xl font-black text-orange-400">00</span>
<span class="text-xs font-bold text-slate-400 uppercase tracking-wider mt-1">Segundos</span>
</div>
</div>
<!-- Mensaje cuando llegue la fecha -->
<div id="expiredMessage" class="hidden text-xl font-extrabold text-emerald-400 mb-6">
     🎉 ¡El evento RelayWeen 2026 ha comenzado! ¡A votar por los mejores disfraces! 👻
</div>
<!-- Botón para ir a la app de votación -->
<div class="space-y-3">
<a href="https://ghostman-mx7.github.io/RelayWeen-2026/" id="voteLinkBtn" class="w-full py-4 rounded-2xl font-extrabold text-sm bg-gradient-to-r from-amber-400 via-orange-400 to-yellow-400 hover:brightness-110 text-slate-950 shadow-lg shadow-amber-500/25 transition inline-block">
       🗳️ Registra tu participación en la App de Votación
</a>
<p class="text-[11px] text-slate-500">Relay Human Cloud</p>
</div>
</main>
<!-- Script del contador -->
<script>
   // Fecha objetivo: 30 de octubre de 2026 a las 00:00:00 horas
   const targetDate = new Date("October 30, 2026 00:00:00").getTime();
   function updateCountdown() {
     const now = new Date().getTime();
     const difference = targetDate - now;
     if (difference <= 0) {
       document.getElementById("countdownGrid").classList.add("hidden");
       document.getElementById("expiredMessage").classList.remove("hidden");
       return;
     }
     const days = Math.floor(difference / (1000 * 60 * 60 * 24));
     const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
     const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
     const seconds = Math.floor((difference % (1000 * 60)) / 1000);
     document.getElementById("days").textContent = String(days).padStart(2, '0');
     document.getElementById("hours").textContent = String(hours).padStart(2, '0');
     document.getElementById("minutes").textContent = String(minutes).padStart(2, '0');
     document.getElementById("seconds").textContent = String(seconds).padStart(2, '0');
   }
   setInterval(updateCountdown, 1000);
   updateCountdown();
</script>
</body>
</html>
